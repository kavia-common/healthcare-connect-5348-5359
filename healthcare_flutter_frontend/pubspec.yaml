name: healthcare_flutter_frontend
description: A minimalist Pure White Flutter app for Healthcare Connect with authentication, doctors, appointments, records, and profile.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: 2.6.1

  # Routing
  go_router: 14.8.1

  # Networking
  dio: 5.9.0

  # Environment variables
  flutter_dotenv: 5.2.1

  # Secure storage (JWT)
  flutter_secure_storage: 9.2.4

  # UI
  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2

flutter:
  uses-material-design: true
  # Include only .env.example so build never fails if developer hasn't created .env yet.
  assets:
    - .env.example
